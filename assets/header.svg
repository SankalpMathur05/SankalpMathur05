<svg xmlns="http://www.w3.org/2000/svg" width="840" height="232" viewBox="0 0 840 232" role="img" aria-label="Sankalp Mathur. AI engineer, Frontend developer, On-device ML, Full-stack &amp; mobile. New Delhi, India. AI and backend at IntelGrader.">
<title>Sankalp Mathur. AI engineer, Frontend developer, On-device ML, Full-stack &amp; mobile. New Delhi, India. AI and backend at IntelGrader.</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}

@keyframes role{0%{opacity:0}3%{opacity:1}22.0%{opacity:1}25.0%{opacity:0}100%{opacity:0}}
.role{opacity:0;animation:role 12s linear infinite}
.caret{animation:blink 1s steps(1,end) infinite}
.orbiter{animation:spin 8s linear infinite}
.orbiter2{animation:spin 14s linear infinite reverse}
@keyframes sweep{to{transform:translateX(1000px)}}
.sweep{animation:sweep 5s cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".07"/></pattern>
<clipPath id="card"><rect width="840" height="232" rx="16"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="840" height="232" fill="#07080d"/>
<rect width="840" height="232" fill="url(#dots)"/>

<text x="44" y="102" class="sans" font-size="46" font-weight="700" letter-spacing="-.5" fill="#eef4ff">Sankalp Mathur</text>
<text x="44" y="150" class="mono" font-size="18" fill="#7d8aa3">&gt;</text>
<g class="role" style="animation-delay:0s">
<text x="66" y="150" class="mono" font-size="18" fill="#00e5ff" filter="url(#glow)">AI engineer</text>
<rect x="189.3" y="135" width="9" height="19" fill="#00e5ff" class="caret" filter="url(#glow)"/>
</g><g class="role" style="animation-delay:3s">
<text x="66" y="150" class="mono" font-size="18" fill="#00e5ff" filter="url(#glow)">Frontend developer</text>
<rect x="265.3" y="135" width="9" height="19" fill="#00e5ff" class="caret" filter="url(#glow)"/>
</g><g class="role" style="animation-delay:6s">
<text x="66" y="150" class="mono" font-size="18" fill="#00e5ff" filter="url(#glow)">On-device ML</text>
<rect x="200.2" y="135" width="9" height="19" fill="#00e5ff" class="caret" filter="url(#glow)"/>
</g><g class="role" style="animation-delay:9s">
<text x="66" y="150" class="mono" font-size="18" fill="#00e5ff" filter="url(#glow)">Full-stack &amp; mobile</text>
<rect x="276.1" y="135" width="9" height="19" fill="#00e5ff" class="caret" filter="url(#glow)"/>
</g>
<text x="44" y="194" class="mono" font-size="13" fill="#7d8aa3">New Delhi, IN  ·  AI &amp; backend @ IntelGrader</text>
<g transform="translate(700 112)">
  <circle r="80" fill="none" stroke="#1c2333" stroke-dasharray="2 6"/>
  <circle r="56" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity=".75" filter="url(#glow)"/>
  <circle r="30" fill="none" stroke="#ff2bd6" stroke-width="1" opacity=".5" filter="url(#glow)"/>
  <g class="orbiter"><circle cx="56" cy="0" r="4.5" fill="#ff2bd6" filter="url(#glow)"/></g>
  <g class="orbiter2"><circle cx="0" cy="-80" r="3" fill="#00e5ff" filter="url(#glow)"/></g>
</g>
<linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset=".2" stop-color="#00e5ff"/><stop offset=".8" stop-color="#ff2bd6"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></linearGradient>
<rect x="0" y="229" width="840" height="2" fill="url(#edge)" opacity=".55" filter="url(#glow)"/>
<linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<rect class="sweep" x="-160" y="229" width="160" height="2" fill="url(#sweep)" filter="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="839" height="231" rx="15.5" fill="none" stroke="#1a1f2b"/>
</svg>
