<svg xmlns="http://www.w3.org/2000/svg" width="840" height="124" viewBox="0 0 840 124" role="img" aria-label="Most used languages across my public repos: TypeScript 46.0%, Python 32.3%, JavaScript 17.1%, CSS 4.4%">
<title>Most used languages across my public repos: TypeScript 46.0%, Python 32.3%, JavaScript 17.1%, CSS 4.4%</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".07"/></pattern>
<clipPath id="card"><rect width="840" height="124" rx="16"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="840" height="124" fill="#07080d"/>
<rect width="840" height="124" fill="url(#dots)"/>
<text x="28" y="38" class="mono" font-size="13" fill="#7d8aa3">// most used languages</text><rect x="28.0" y="56" width="358.4" height="6" rx="3" fill="#00e5ff" filter="url(#glow)"/><rect x="389.4" y="56" width="250.6" height="6" rx="3" fill="#ff2bd6" filter="url(#glow)"/><rect x="643.1" y="56" width="131.0" height="6" rx="3" fill="#a855f7" filter="url(#glow)"/><rect x="777.1" y="56" width="31.9" height="6" rx="3" fill="#39ff88" filter="url(#glow)"/><circle cx="32" cy="94" r="4" fill="#00e5ff" filter="url(#glow)"/><text x="42" y="98" class="mono" font-size="12.5" fill="#d7e6ff">TypeScript <tspan fill="#7d8aa3">46.0%</tspan></text><circle cx="187.6" cy="94" r="4" fill="#ff2bd6" filter="url(#glow)"/><text x="197.6" y="98" class="mono" font-size="12.5" fill="#d7e6ff">Python <tspan fill="#7d8aa3">32.3%</tspan></text><circle cx="312.79999999999995" cy="94" r="4" fill="#a855f7" filter="url(#glow)"/><text x="322.79999999999995" y="98" class="mono" font-size="12.5" fill="#d7e6ff">JavaScript <tspan fill="#7d8aa3">17.1%</tspan></text><circle cx="468.4" cy="94" r="4" fill="#39ff88" filter="url(#glow)"/><text x="478.4" y="98" class="mono" font-size="12.5" fill="#d7e6ff">CSS <tspan fill="#7d8aa3">4.4%</tspan></text>
</g>
<rect x=".5" y=".5" width="839" height="123" rx="15.5" fill="none" stroke="#1a1f2b"/>
</svg>
