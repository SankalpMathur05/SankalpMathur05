<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="My stack in orbit: Python, TypeScript, React, Next.js, PyTorch, FastAPI, Kotlin, PostgreSQL, ONNX, Docker and React Native.">
<title>My stack in orbit: Python, TypeScript, React, Next.js, PyTorch, FastAPI, Kotlin, PostgreSQL, ONNX, Docker and React Native.</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
.r0{transform-origin:420px 196px;animation:spin 36s linear infinite}
.r1{transform-origin:420px 196px;animation:spin 60s linear infinite}
.r2{transform-origin:420px 196px;animation:spin 90s linear infinite}
@keyframes core{50%{stroke-opacity:.35}}.core{animation:core 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".07"/></pattern>
<clipPath id="card"><rect width="840" height="400" rx="16"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="840" height="400" fill="#07080d"/>
<rect width="840" height="400" fill="url(#dots)"/>

<text x="28" y="40" class="mono" font-size="13" fill="#7d8aa3">// stack in orbit</text>
<circle cx="420" cy="196" r="74" fill="none" stroke="#1c2333"/>
<g class="r0"><g style="transform-origin:494px 196px;animation:spin 36s linear infinite reverse">
<circle cx="494" cy="196" r="4" fill="#00e5ff" filter="url(#glow)"/>
<text x="494" y="216" class="mono" font-size="12.5" fill="#d7e6ff" text-anchor="middle">Python</text>
</g><g style="transform-origin:346px 196px;animation:spin 36s linear infinite reverse">
<circle cx="346" cy="196" r="4" fill="#ff2bd6" filter="url(#glow)"/>
<text x="346" y="216" class="mono" font-size="12.5" fill="#d7e6ff" text-anchor="middle">TypeScript</text>
</g></g>
<circle cx="420" cy="196" r="116" fill="none" stroke="#1c2333" stroke-dasharray="3 7"/>
<g class="r1"><g style="transform-origin:508.7px 270.7px;animation:spin 60s linear infinite reverse">
<circle cx="508.7" cy="270.7" r="4" fill="#a855f7" filter="url(#glow)"/>
<text x="508.7" y="290.7" class="mono" font-size="12.5" fill="#d7e6ff" text-anchor="middle">React</text>
</g><g style="transform-origin:345.3px 284.7px;animation:spin 60s linear infinite reverse">
<circle cx="345.3" cy="284.7" r="4" fill="#39ff88" filter="url(#glow)"/>
<text x="345.3" y="304.7" class="mono" font-size="12.5" fill="#d7e6ff" text-anchor="middle">Next.js</text>
</g><g style="transform-origin:331.3px 121.3px;animation:spin 60s linear infinite reverse">
<circle cx="331.3" cy="121.3" r="4" fill="#ffd166" filter="url(#glow)"/>
<text x="331.3" y="141.3" class="mono" font-size="12.5" fill="#d7e6ff" text-anchor="middle">PyTorch</text>
</g><g style="transform-origin:494.7px 107.3px;animation:spin 60s linear infinite reverse">
<circle cx="494.7" cy="107.3" r="4" fill="#ff6b3d" filter="url(#glow)"/>
<text x="494.7" y="127.3" class="mono" font-size="12.5" fill="#d7e6ff" text-anchor="middle">FastAPI</text>
</g></g>
<circle cx="420" cy="196" r="168" fill="none" stroke="#1c2333"/>
<g class="r2"><g style="transform-origin:448.6px 361.6px;animation:spin 90s linear infinite reverse">
<circle cx="448.6" cy="361.6" r="4" fill="#ffd166" filter="url(#glow)"/>
<text x="448.6" y="381.6" class="mono" font-size="12.5" fill="#d7e6ff" text-anchor="middle">Kotlin</text>
</g><g style="transform-origin:271.4px 274.3px;animation:spin 90s linear infinite reverse">
<circle cx="271.4" cy="274.3" r="4" fill="#ff6b3d" filter="url(#glow)"/>
<text x="271.4" y="294.3" class="mono" font-size="12.5" fill="#d7e6ff" text-anchor="middle">PostgreSQL</text>
</g><g style="transform-origin:299.6px 78.8px;animation:spin 90s linear infinite reverse">
<circle cx="299.6" cy="78.8" r="4" fill="#00e5ff" filter="url(#glow)"/>
<text x="299.6" y="98.8" class="mono" font-size="12.5" fill="#d7e6ff" text-anchor="middle">ONNX</text>
</g><g style="transform-origin:494.2px 45.3px;animation:spin 90s linear infinite reverse">
<circle cx="494.2" cy="45.3" r="4" fill="#ff2bd6" filter="url(#glow)"/>
<text x="494.2" y="65.3" class="mono" font-size="12.5" fill="#d7e6ff" text-anchor="middle">Docker</text>
</g><g style="transform-origin:586.3px 220px;animation:spin 90s linear infinite reverse">
<circle cx="586.3" cy="220" r="4" fill="#a855f7" filter="url(#glow)"/>
<text x="586.3" y="240" class="mono" font-size="12.5" fill="#d7e6ff" text-anchor="middle">React Native</text>
</g></g>
<circle cx="420" cy="196" r="30" fill="#07080d" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)" class="core"/>
<text x="420" y="202" class="sans" font-size="17" font-weight="700" fill="#eef4ff" text-anchor="middle">SM</text>
</g>
<rect x=".5" y=".5" width="839" height="399" rx="15.5" fill="none" stroke="#1a1f2b"/>
</svg>
